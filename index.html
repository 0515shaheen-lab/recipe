<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Delight</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-black">
    <header>
        <div class="container-full mx-auto border border-b-1 border-white flex justify-center py-2.5">
            <img src="https://www.wscubetech.co/week-project/web-foundations/week-4/assets/img/ws.png" alt="logo" class="w-[150px] ">
        </div>
    </header>
    <section>
        <div class="container border border-1 border-red-500 mx-auto">
            <h1 class="text-white text-center pt-8 lg:text-6xl md:text-3xl text-xl font-bold">Find your next favorite meal</h1>
            <p class="text-gray-400 text-center pt-5">Search hundreds of recipes by name, ingredient, or cuisine.</p>
            <div class="mx-auto text-center">
                <input class=" bg-blue-950 w-[570px] h-[50px] text-white mt-8 py-3 px-4 border border-gray-700 rounded-lg " type="text" placeholder=" Try pasta, spicy, breakfast...">
            </div>

            
            <ul class="container flex mx-auto justify-center text-white gap-[10px] mt-8">
                <li class="bg-white text-black border border-0.1 border-gray-300 rounded-full py-2 px-4">All</li>
                <li class="hover:bg-blue-600 border border-0.1 border-blue-950 rounded-full py-2 px-4">Quick</li>
                <li class="hover:bg-blue-600 border border-0.1 border-blue-950 rounded-full py-2 px-4">Vegetarian</li>
                <li class="hover:bg-blue-600 border border-0.1 border-blue-950 rounded-full py-2 px-4">Healthy</li>
                <li class="hover:bg-blue-600 border border-0.1 border-blue-950 rounded-full py-2 px-4">Dessert</li>
                <li class="hover:bg-blue-600 border border-0.1 border-blue-950 rounded-full py-2 px-4">Spicy</li>
                    
            </ul>

            <div class="w-[1250px] text-gray-400 mx-auto mt-8">6 Recipes</div>

            <div class="w-[1250px] mx-auto mt-3 border border-1 border-blue-500 flex flex-wrap gap-[10px] justify-between px-5 ">
                <div class="w-[380px] border border-1 border-white rounded-2xl h-[226px] overflow-hidden hover:translate-y-2">
                    <div class="overflow-hidden"><img class="w-full h226 object-cover " src="https://www.wscubetech.co/week-project/web-foundations/week-4/assets/img/pasta.jpg" alt="pasta"></div>
                    <div></div>
                </div>
                <div class="w-[380px] border border-1 border-white rounded-2xl h-[226px] overflow-hidden hover:translate-y-2">
                    <div class="overflow-hidden"><img class="w-full h226 object-cover " src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600" alt="buddha bowl"></div>
                    <div></div>
                </div>
                <div class="w-[380px] border border-1 border-white rounded-2xl h-[226px] overflow-hidden hover:translate-y-2">
                    <div class="overflow-hidden"><img class="w-full h226 object-cover " src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=600" alt="margherita"></div>
                    <div></div>
                </div>
                <div class="w-[380px] border border-1 border-white rounded-2xl h-[226px] overflow-hidden hover:translate-y-2">
                    <div class="overflow-hidden"><img class="w-full h226 object-cover " src="https://images.unsplash.com/photo-1525351484163-7529414344d8?w=600" alt="avocado toast"></div>
                    <div></div>
                </div>
                <div class="w-[380px] border border-1 border-white rounded-2xl h-[226px] overflow-hidden hover:translate-y-2">
                    <div class="overflow-hidden"><img class="w-full h226 object-cover " src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600" alt="rainbow salad"></div>
                    <div></div>
                </div>
                <div class="w-[380px] border border-1 border-white rounded-2xl h-[226px] overflow-hidden hover:translate-y-2">
                    <div class="overflow-hidden"><img class="w-full h226 object-cover " src="https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=600" alt="rice"></div>
                    <div></div>
                </div>
            </div>
            
        </div>
    </section>
</body>
</html>
